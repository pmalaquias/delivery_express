[versions]
kotlin = "2.1.0"
androidGradlePlugin  = "8.13.1"
hilt = "2.51.1"
hilt_navigation_compose = "1.2.0"
androidx_core = "1.16.0"
lifecycle_runtime = "2.8.7"
activity_compose = "1.10.1"
compose_ui = "1.8.0"
compose_material3 = "1.5.0-alpha09"
navigation_compose = "2.8.9"

[plugins]
android_application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin_android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin_kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt_android = { id = "dagger.hilt.android.plugin", version.ref = "hilt" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx_core" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle_runtime" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity_compose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose_ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose_ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose_material3" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation_compose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt_navigation_compose" }
